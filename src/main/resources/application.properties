server.port=9010
security.require-ssl=true
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}

encryption.key=${ENCRYPTION_KEY:}
File.Location.Local=${FileLocation_FJ:}
Creds.Location.Local=${CredsLocation_FJ:}

sandbox.base-dir=${SANDBOX_BASE_DIR:${java.io.tmpdir}/code-exec}
sandbox.compile-timeout=5s
sandbox.execution-timeout=5s
sandbox.max-memory-mb=256
sandbox.pool-size=32
sandbox.queue-capacity=500
sandbox.cleanup=true
sandbox.fallback-class-name=Main
sandbox.jdk-paths.17=${JDK_17_HOME:}
sandbox.jdk-paths.21=${JDK_21_HOME:}
sandbox.jdk-paths.11=${JDK_11_HOME:}
sandbox.default-version=${SANDBOX_DEFAULT_VERSION:}
